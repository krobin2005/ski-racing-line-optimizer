# Companion to gran_risa_margin.yaml: the hybrid, with its Adam phase on the sharp penalty with a 5 cm
# margin and starting at full weight (it starts from CMA-ES's clean line, so there is nothing to anneal).
experiment: gran_risa_margin

course: {kind: gran_risa, seed: 0}
policy: arc
objective: {beta_miss: 200.0, miss_margin: 0.05}

methods:
  - {name: hybrid, cma_fraction: 0.3, cmaes: {population: 32, sigma: 0.5}, adam: {lr: 0.05, lr_final: 0.005, lam_gate_start: 100.0}}

seeds: [0, 1, 2]
