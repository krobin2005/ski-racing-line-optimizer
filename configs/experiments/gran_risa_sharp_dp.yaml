# Companion to gran_risa_sharp.yaml: DP -> Adam with the sharp penalty. The DP line already passes
# every gate, so the refinement starts at the full penalty weight instead of annealing up to it.
# DP and Adam are deterministic here, so one seed is enough.
experiment: gran_risa_sharp

course: {kind: gran_risa, seed: 0}
policy: arc
objective: {beta_miss: 200.0}

methods:
  - {name: dp, label: dp_adam, refine: adam, adam: {lr: 0.05, lr_final: 0.005, lam_gate_start: 100.0}}

seeds: [0]
