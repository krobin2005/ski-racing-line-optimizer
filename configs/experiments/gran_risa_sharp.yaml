# Ablation (REPORT.md §6): the smooth gate penalty lam * softplus(beta * miss)^2 / beta^2 is not zero
# inside a gate; at beta = 5 /m and lam = 100 a line on the pass limit pays ~1.9 s per gate, so the
# gradient methods pass gates wider than they need to. beta = 200 makes that bias negligible
# (~0.001 s per gate). Same course, physics and budget as gran_risa.yaml; only the penalty changes.
#     python -m skiopt.batch configs/experiments/gran_risa_sharp.yaml configs/experiments/gran_risa_sharp_dp.yaml
experiment: gran_risa_sharp

course: {kind: gran_risa, seed: 0}
policy: arc
objective: {beta_miss: 200.0}

methods:
  - {name: adam, lr: 0.1, lr_final: 0.01}
  - {name: cmaes_smooth, population: 32, sigma: 0.5}

seeds: [0, 1, 2]
