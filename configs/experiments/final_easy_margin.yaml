# 2D side of gran_risa_margin.yaml: sharp penalty with a 5 cm margin on the easy course.
experiment: final_easy_margin

course: {kind: library, name: easy}
policy: arc
objective: {beta_miss: 200.0, miss_margin: 0.05}

methods:
  - {name: adam, lr: 0.1, lr_final: 0.01}
  - {name: cmaes_smooth, population: 32, sigma: 0.5}

seeds: [0, 1, 2]
