# The 3D stage (docs/ROADMAP_3D.md): the Gran Risa, real terrain, a FIS-valid set with the gate count
# of the 21 Dec 2025 World Cup GS, run 1 (52 gates, 51 turning gates). Reference: fastest run 76.00 s.
#     python -m skiopt.run configs/experiments/gran_risa.yaml
experiment: gran_risa

course: {kind: gran_risa, seed: 0}
policy: arc

methods:
  - {name: coach_line}
  - {name: adam, lr: 0.1, lr_final: 0.01}
  - {name: cmaes, population: 32, sigma: 0.5}
  - {name: cmaes_smooth, population: 32, sigma: 0.5}
  - {name: ga, population: 128, sigma: 1.0, sigma_final: 0.02, p_mutate: 0.3}
  - {name: hybrid, cma_fraction: 0.3, cmaes: {population: 32, sigma: 0.5}, adam: {lr: 0.05, lr_final: 0.005}}

seeds: [0, 1, 2]
